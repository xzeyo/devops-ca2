apiVersion: v1
kind: Service
metadata:
  name: hello-service
  labels:
    app: hello-service
spec:
  type: NodePort
  selector:
    app: hello-service
  ports:
    - name: http
      port: 8080        # service port inside the cluster
      targetPort: 8080  # container port
      nodePort: 30080   # exposed on the node -> http://localhost:30080